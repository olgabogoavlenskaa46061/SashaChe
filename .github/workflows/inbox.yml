name: Голосовые → ролики

on:
  schedule:
    # Каждый час в :41 проверяет, пришли ли голосовые, и собирает по ним ролики.
    # Проверка без голосовых занимает секунды.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sashache-bot
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Скачать код
        uses: actions/checkout@v7

      - name: Есть ли новые голосовые?
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 shorts/check_inbox.py >> "$GITHUB_OUTPUT"

      - name: Установить Python
        if: steps.check.outputs.work == 'true' || env.MANUAL == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить ffmpeg
        if: steps.check.outputs.work == 'true' || env.MANUAL == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Установить библиотеки
        if: steps.check.outputs.work == 'true' || env.MANUAL == 'true'
        run: pip install -r requirements.txt

      - name: Собрать ролики и отправить в Telegram
        if: steps.check.outputs.work == 'true' || env.MANUAL == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          USE_CLIPS: ${{ vars.USE_CLIPS }}
          CLIP_VOLUME: ${{ vars.CLIP_VOLUME }}
          CLIP_ZOOM: ${{ vars.CLIP_ZOOM }}
          CLIP_SOURCE: ${{ vars.CLIP_SOURCE }}
          VIDEO_STYLE: ${{ vars.VIDEO_STYLE }}
          SUBTITLES: ${{ vars.SUBTITLES }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
        run: python main.py inbox

      - name: Запомнить, что уже обработано
        if: always() && (steps.check.outputs.work == 'true' || env.MANUAL == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/pending.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Голосовые $(date -u '+%F %H:%M')"
          git pull --rebase --autostash -q || true
          git push || echo "Сохранить не удалось — на ролики это не влияет"

      - name: Сохранить ролики на 7 дней (Summary → Artifacts)
        if: always() && (steps.check.outputs.work == 'true' || env.MANUAL == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
